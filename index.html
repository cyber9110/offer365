<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>handicap · offer365</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #fff;
    --line: #e3e6ea;
    --text: #24292f;
    --muted: #6a737d;
    --accent: #1a6fd4;
    --red: #d0342c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px;
    background: var(--bg); color: var(--text);
    font: 14px/1.6 "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .bar {
    display: flex; align-items: center; gap: 12px;
    flex-wrap: wrap; margin-bottom: 12px;
  }
  button {
    padding: 6px 16px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; border-radius: 4px;
    cursor: pointer; font-size: 13px;
  }
  button:hover { opacity: .88; }
  button:disabled { opacity: .5; cursor: default; }
  .opt { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; }
  .opt input { margin: 0; cursor: pointer; }
  select {
    padding: 5px 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--text);
    border-radius: 4px; font-size: 13px; cursor: pointer;
  }
  select:disabled { opacity: .5; cursor: default; }
  .status { color: var(--muted); font-size: 13px; }
  .status.err { color: var(--red); }
  table {
    width: 100%; border-collapse: collapse;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 6px; overflow: hidden;
  }
  th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; }
  th { background: #eef1f4; font-weight: 600; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #f8fafc; }
  /* 刷新失败时表内仍是旧数据，淡化提示已过期 */
  table.stale tbody { opacity: .5; }
  .league { white-space: nowrap; font-weight: 600; text-align: center; }
  .league .bg {
    display: inline-block; padding: 2px 10px; border-radius: 3px;
    color: #fff; background-color: #6a737d; min-width: 40px;
    font-size: 12px;
  }
  .time { white-space: nowrap; font-family: Consolas, Menlo, monospace; }
  .score { font-family: Consolas, Menlo, monospace; font-weight: 700; margin: 0 6px; }
  .team { color: var(--text); }
  .odds { white-space: nowrap; font-weight: 600; }
  .star { color: var(--red); font-weight: 700; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  .note { margin-top: 12px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>筛选后的比赛</h1>

  <div class="bar">
    <button id="btn">重新筛选</button>
    <label class="opt"><input type="checkbox" id="auto" checked> 自动刷新</label>
    <select id="interval">
      <option value="30">每 30 秒</option>
      <option value="60" selected>每 1 分钟</option>
      <option value="120">每 2 分钟</option>
      <option value="300">每 5 分钟</option>
    </select>
    <span class="status" id="status">正在加载…</span>
  </div>

  <table id="tbl">
    <thead>
      <tr>
        <th style="width:70px">时间</th>
        <th style="width:90px">联赛类型</th>
        <th>主客队比分</th>
        <th style="width:110px">让球盘口</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td class="empty" colspan="4">正在获取数据…</td></tr>
    </tbody>
  </table>

  <div class="note">页面打开时自动执行一次筛选，之后按所选间隔自动刷新；刷新失败会保留上一次结果并逐次延长重试间隔。</div>
</div>

<script>
// 盘口数字 -> 中文叫法，索引 = |盘口| * 4
var GOAL_CN = ("平手,平/半,半球,半/一,一球,一/球半,球半,球半/两,两球,两/两球半,两球半,两球半/三,三球," +
  "三/三球半,三球半,三球半/四球,四球,四/四球半,四球半,四球半/五,五球,五/五球半,五球半,五球半/六,六球," +
  "六/六球半,六球半").split(",");

function goalText(v) {
  var abs = Math.abs(v);
  var idx = Math.round(abs * 4);
  return GOAL_CN[idx] !== undefined ? GOAL_CN[idx] : abs + "球";
}

// "HH:MM" -> 当天分钟数，便于按开赛时间排序；解析失败时用较大值排在后面
function timeToMin(t) {
  var m = /^(\d{1,2}):(\d{2})$/.exec(t);
  if (!m) return 24 * 60;
  return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
}

// bfdata_ut.js 中 A[i] 各字段的下标。
// 队名三套写法：+0 简体、+1 繁體、+2 Crow*（英文）；主/客队 ID 在 37/38。
var F = {
  COLOR: 1, TIME: 11, LEAGUE: 2,
  HOME: 5, AWAY: 8,
  HOME_ID: 37, AWAY_ID: 38,
  STATE: 13, HOME_SCORE: 14, AWAY_SCORE: 15, HANDICAP: 29
};

// 让球盘口绝对值门槛（球）
var MIN_HANDICAP = 1;

var LEAGUES = [
  '英超', '英冠', '英甲', '西甲', '西乙', '德甲', '德乙', '意甲', '法甲', '法乙', '中超', '澳超', '澳维超', '澳威超', '比甲', '苏超', '葡超', '荷甲', '荷乙',
  '俄超', '奥甲', '瑞士超', '希腊超', '芬超', '芬甲', '挪超', '挪甲', '瑞典超', '瑞典甲', '丹麦超', '日职联', '日职乙', '美职业', '阿甲', '巴西甲', '巴西乙',
  '土超', '韩K联', '韩K2联', '墨西联', '厄瓜甲', '哥伦甲', '沙特联', '英足总杯', '英联杯', '德国杯', '意杯', '法国杯', '西杯', '俄杯', '巴西杯', '日联杯', '韩国杯',
  '澳足总', '欧冠杯', '欧罗巴杯', '欧协联', '解放者杯', '南美杯', '亚冠精英', '中北美杯', '欧洲预选', '北美预选', '南美预选', '亚洲预选', '非洲预选', '欧洲杯', '欧国联',
  '世界杯','欧青U19','欧青U21','欧青U21外','非洲杯'
];

var LEAGUE_SET = {};
for (var li = 0; li < LEAGUES.length; li++) LEAGUE_SET[LEAGUES[li]] = true;

// 部分联赛按赛季拆成「哥伦甲春 / 墨西联秋」，去掉季度后缀后再比对
function inLeagues(name) {
  if (LEAGUE_SET[name]) return true;
  var last = name.charAt(name.length - 1);
  if (last === "春" || last === "秋") return !!LEAGUE_SET[name.slice(0, -1)];
  return false;
}

// livestatic 那个域名有防盗链：Referer 不是 *.titan007.com 时会返回 HTTP 200 + 空 body，
// 脚本能"加载成功"却什么都不执行，只能等超时。bf 这个域名同样的数据、同样的字段，且不校验 Referer。
var DATA_URL = "https://bf.titan007.com/vbsxml/bfdata_ut.js?r=007";
var TIMEOUT = 20000;          // 单次请求超时
var MAX_BACKOFF = 5 * 60000;  // 连续失败时的退避上限

// ---- Crow* 队名（alias3.txt，id^3^译名 逗号分隔）----
// 只读本页同级目录的 alias3.txt（由服务器定时任务抓取更新，https://bf.titan007.com/vbsxml/alias3.txt?r=007）；
// 里面读不到别名的球队，回退显示线上简体名称。

var aliasMap = {};        // 球队ID -> Crow* 译名（简体回退时留空）
var aliasReady = null;    // alias3.txt 加载完成的 Promise

// 解析 alias3.txt 文本；文件开头可能带 BOM
function parseAlias(text) {
  var map = {};
  var parts = String(text || "").replace(/^\uFEFF/, "").split(",");
  for (var i = 0; i < parts.length; i++) {
    var seg = parts[i].split("^");
    if (seg.length >= 3 && seg[1] === "3" && seg[2] !== "") map[seg[0]] = seg[2];
  }
  return map;
}

// alias3.txt 可能是 GBK 或 UTF-8：先按 UTF-8 解码，若出现乱码替换符则改用 GBK 解码
function decodeAliasBuf(buf) {
  var s = new TextDecoder("utf-8").decode(buf);
  if (s.indexOf("\uFFFD") === -1) return s;
  try { return new TextDecoder("gbk").decode(buf); } catch (e) { return s; }
}

// 打开页面时读取本目录 alias3.txt；失败时 aliasMap 保持为空，队名回退简体
var aliasSource = "offline";  // "live" = 读到本地 alias3.txt；"offline" = 未读到

function fetchAliasText(url) {
  return fetch(url)
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.arrayBuffer();
    })
    .then(function (buf) {
      var text = decodeAliasBuf(buf);
      if (!text) throw new Error("空内容");
      return text;
    });
}

function ensureAlias() {
  if (aliasReady) return aliasReady;
  var t = Date.now();
  aliasReady = fetchAliasText("alias3.txt?_=" + t).then(
    function (text) { aliasMap = parseAlias(text); aliasSource = "live"; },
    function () { aliasMap = {}; aliasSource = "offline"; }
  );
  return aliasReady;
}

// 状态栏标注：本次是否读到本地 Crow* 译名（未读到则队名回退简体）
function aliasTag() {
  return aliasSource === "live" ? " · Crow" : " · 简体";
}


var statusEl = document.getElementById("status");
var tbodyEl = document.getElementById("tbody");
var tableEl = document.getElementById("tbl");
var btnEl = document.getElementById("btn");
var autoEl = document.getElementById("auto");
var intervalEl = document.getElementById("interval");

var pending = false;   // 是否有请求在途
var hasData = false;   // 表格里是否已有有效结果
var reqSeq = 0;        // 请求序号，用来丢弃迟到的旧请求回调
var failCount = 0;     // 连续失败次数
var lastOkAt = 0;      // 上次成功刷新的时间戳
var baseText = "正在加载…";
var baseErr = false;
var nextAt = 0;        // 下次自动刷新的时间戳，0 表示未安排

function setStatus(msg, isErr) {
  baseText = msg;
  baseErr = !!isErr;
  paintStatus();
}

function timeStr(ts) {
  return new Date(ts).toLocaleTimeString("zh-CN");
}

// 状态栏 = 基础文案 + 失败次数 + 旧数据时间 + 倒计时
function paintStatus() {
  var parts = [baseText];

  if (baseErr) {
    if (failCount > 1) parts.push("连续失败 " + failCount + " 次");
    if (hasData && lastOkAt) {
      var mins = Math.floor((Date.now() - lastOkAt) / 60000);
      parts.push("表内仍是 " + timeStr(lastOkAt) + " 的数据" + (mins >= 1 ? "（已 " + mins + " 分钟）" : ""));
    }
  }

  if (pending) {
    // 请求在途，不显示倒计时
  } else if (!autoEl.checked) {
    if (baseErr) parts.push("自动刷新已关闭，请手动重试");
  } else if (nextAt) {
    var left = Math.max(0, Math.ceil((nextAt - Date.now()) / 1000));
    parts.push(left + "s 后" + (baseErr ? "重试" : "刷新"));
  }

  statusEl.textContent = parts.join(" · ");
  statusEl.className = baseErr ? "status err" : "status";
  // 失败但表里还有旧数据时淡化表格，避免把过期比分当成实时数据
  tableEl.className = baseErr && hasData ? "stale" : "";
}

// 正常按选定间隔；连续失败则逐次加倍退避，避免网络异常时反复空转
function schedule() {
  if (!autoEl.checked) { nextAt = 0; return; }
  var base = (parseInt(intervalEl.value, 10) || 60) * 1000;
  var delay = failCount ? Math.min(base * Math.pow(2, failCount - 1), MAX_BACKOFF) : base;
  nextAt = Date.now() + delay;
}

function onSuccess() {
  failCount = 0;
  lastOkAt = Date.now();
  schedule();
  paintStatus();
}

function onFail(msg) {
  failCount++;
  setStatus(msg, true);
  // 已有结果时保留旧数据，只在状态栏提示，避免一次网络抖动清空表格
  if (!hasData) {
    tbodyEl.innerHTML = '<tr><td class="empty" colspan="4">' + esc(msg) + "</td></tr>";
  }
  schedule();
  paintStatus();
}

// 用 script 标签加载数据文件（该文件本身就是 JS，末尾会调用 ShowBf()），避开跨域限制
function loadData(manual) {
  if (pending) return;
  if (manual) failCount = 0;  // 手动触发时清掉退避，立即按原节奏重来

  if (navigator.onLine === false) {
    onFail("网络已断开");
    return;
  }

  pending = true;
  nextAt = 0;
  btnEl.disabled = true;
  setStatus(hasData ? "正在刷新…" : "正在加载…");

  var seq = ++reqSeq;
  var settled = false;
  var timer = 0;
  var s = document.createElement("script");

  function cleanup() {
    clearTimeout(timer);
    s.onerror = s.onload = null;
    if (s.parentNode) s.parentNode.removeChild(s);
  }

  function settle(err) {
    if (settled) return;
    settled = true;
    cleanup();
    // 已被新请求取代的旧回调：清理掉即可，不要改动共享状态
    if (seq !== reqSeq) return;
    pending = false;
    btnEl.disabled = false;
    if (err) onFail(err); else onSuccess();
  }

  window.ShowBf = function () {
    if (seq !== reqSeq) return;  // 超时后迟到的旧数据，直接丢弃
    // 先等 Crow* 译名表就绪（拉到就用，拉不到队名回退简体），再收集渲染
    ensureAlias().then(function () {
      if (seq !== reqSeq) return;  // 等待期间已被新请求取代
      var list;
      try {
        list = collect();
      } catch (e) {
        settle("数据解析失败：" + e.message);
        return;
      }
      render(list);
      settle();
    });
  };

  s.onerror = function () { settle("加载失败（网络异常或被拦截）"); };
  // 脚本执行完才触发 onload，此时仍未 settle 说明返回的是空内容（防盗链常见做法），
  // 直接报错，不必干等到超时
  s.onload = function () { settle("数据源返回空内容（可能被防盗链拦截）"); };
  s.charset = "utf-8";
  s.src = DATA_URL + Date.now();
  timer = setTimeout(function () { settle("加载超时"); }, TIMEOUT);
  document.body.appendChild(s);
}

// 每秒跑一次：到点就刷新，顺带更新倒计时和过期时长
setInterval(function () {
  if (autoEl.checked && !pending && nextAt && Date.now() >= nextAt) {
    loadData();
    return;
  }
  paintStatus();
}, 1000);

autoEl.addEventListener("change", function () {
  if (autoEl.checked) failCount = 0;  // 重新打开视为用户希望立刻恢复正常节奏
  schedule();
  paintStatus();
});

intervalEl.addEventListener("change", function () {
  schedule();
  paintStatus();
});

// 断网期间不做无谓尝试，网络恢复后立刻补一次
window.addEventListener("online", function () {
  if (!baseErr) return;
  failCount = 0;
  if (autoEl.checked) loadData();
  else { setStatus("网络已恢复，可手动重试", true); }
});

window.addEventListener("offline", function () {
  if (!pending) { setStatus("网络已断开", true); paintStatus(); }
});

// ---- 解析 ----

// 不同域名给的 A[i] 形态不同：bf 给的是数组，livestatic 给的是 ^ 分隔的字符串，字段下标一致
function toFields(row) {
  if (row == null) return null;
  return typeof row === "string" ? row.split("^") : row;
}

// 队名逻辑：球队 ID 命中 alias 表就用别名，否则用简体名；
// 简体名带 (中) 时给别名补上同款标记
function teamName(row, idIdx, cnIdx) {
  var base = strip(row[cnIdx]);
  var name = aliasMap[row[idIdx]];
  if (name == null) return base;
  return base.indexOf("(中)") !== -1 ? name + "(中)" : name;
}

// 单条原始记录（A[i]）-> 比赛对象；不是有效场次时返回 null
// 盘口为空时 handicap 为 NaN，交给 passHandicap 判定
function parseMatch(raw) {
  var row = toFields(raw);
  if (!row || !row[0] || row[0] === "0") return null;
  return {
    color: strip(row[F.COLOR]),
    time: strip(row[F.TIME]),
    league: strip(row[F.LEAGUE]),
    home: teamName(row, F.HOME_ID, F.HOME),
    away: teamName(row, F.AWAY_ID, F.AWAY),
    homeScore: row[F.HOME_SCORE],
    awayScore: row[F.AWAY_SCORE],
    started: parseInt(row[F.STATE], 10) !== 0,
    handicap: parseFloat(row[F.HANDICAP]),
    kickoff: timeToMin(strip(row[F.TIME]))
  };
}

// ---- 过滤 ----

// 联赛白名单
function passLeague(m) {
  return inLeagues(m.league);
}

// 让球盘口绝对值达到门槛（盘口缺失的 NaN 比较结果为 false，会被排除）
function passHandicap(m) {
  return Math.abs(m.handicap) >= MIN_HANDICAP;
}

// 全部规则都通过才保留
function passFilters(m) {
  return passLeague(m) && passHandicap(m);
}

// ---- 排序 ----

// 联赛按拼音升序，同联赛内按开赛时间升序
function sortMatches(list) {
  return list.sort(function (a, b) {
    var c = a.league.localeCompare(b.league, "zh-Hans-CN");
    if (c !== 0) return c;
    return a.kickoff - b.kickoff;
  });
}

// 取全局数据 -> 解析 -> 过滤 -> 排序
function collect() {
  var A = window.A, total = window.matchcount;
  if (!A || !total) throw new Error("未取到比赛数据");

  var list = [];
  for (var i = 1; i <= total; i++) {
    var m = parseMatch(A[i]);
    if (m && passFilters(m)) list.push(m);
  }
  return sortMatches(list);
}

// 队名字段里带有 <font> 之类的标记，统一去掉
function strip(v) {
  return String(v == null ? "" : v).replace(/<[^>]*>/g, "").trim();
}

function esc(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function render(list) {
  hasData = true;
  if (!list.length) {
    tbodyEl.innerHTML = '<tr><td class="empty" colspan="4">指定联赛中当前没有让球盘口达到 1 球的比赛。</td></tr>';
    setStatus("筛选完成：0 场 · " + new Date().toLocaleTimeString("zh-CN") + aliasTag());
    return;
  }

  var html = list.map(function (m) {
    var score = m.started ? m.homeScore + "-" + m.awayScore : "vs";
    var star = m.handicap < 0 ? '<span class="star">*</span>' : "";
    var bg = /^#[0-9a-f]{6}$/i.test(m.color)
      ? 'style="background-color:' + m.color + '"' : "";
    return "<tr>" +
      '<td class="time">' + esc(m.time) + "</td>" +
      '<td class="league"><span class="bg" ' + bg + ">" + esc(m.league) + "</span></td>" +
      "<td>" + '<span class="team">' + esc(m.home) + "</span>" +
        '<span class="score">' + esc(score) + "</span>" +
        '<span class="team">' + esc(m.away) + "</span></td>" +
      '<td class="odds">' + star + esc(goalText(m.handicap)) + "</td>" +
      "</tr>";
  }).join("");

  tbodyEl.innerHTML = html;
  setStatus("筛选完成：" + list.length + " 场 · " + new Date().toLocaleTimeString("zh-CN") + aliasTag());
}

btnEl.addEventListener("click", function () { loadData(true); });
loadData();
</script>
</body>
</html>
